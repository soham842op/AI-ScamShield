name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q
      - name: OpenAPI matches the checked-in snapshot
        run: |
          uv run python scripts/export_openapi.py "$RUNNER_TEMP/openapi.json"
          diff -u ../tests/contract/openapi.snapshot.json "$RUNNER_TEMP/openapi.json"
      - run: uv run pip-audit

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: ml/uv.lock
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Unit tests only: they need no dataset download and no trained model.
      - run: uv run pytest -q
      - name: scikit-learn pin matches the backend
        run: |
          grep -q '"scikit-learn==1.9.1"' pyproject.toml
          grep -q '"scikit-learn==1.9.1"' ../backend/pyproject.toml
      - run: uv run pip-audit

  backend-db:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://scamshield:change-me@localhost:5432/scamshield_test
      TEST_DATABASE_URL: postgresql+psycopg://scamshield:change-me@localhost:5432/scamshield_test
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # CI-only throwaway credentials for an ephemeral container.
          POSTGRES_USER: scamshield
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: scamshield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scamshield -d scamshield_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync
      - name: Migrate up from an empty database
        run: uv run alembic upgrade head
      - name: Check models match migrations
        run: uv run alembic check
      - name: Migrate down to base
        run: uv run alembic downgrade base
      - name: Migrate up again
        run: uv run alembic upgrade head
      - name: Integration tests
        run: uv run pytest -q -m integration
      - name: Purge job
        run: uv run python -m app.jobs.purge

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types are current
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Blocking: dependencies that ship in the static export.
      - run: npm audit --omit=dev --audit-level=high
      # Report only: build and lint tooling, tracked through Dependabot.
      - run: npm audit --audit-level=high
        continue-on-error: true

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan repository history
        run: ./gitleaks git --redact --verbose .
